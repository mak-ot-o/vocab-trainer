name: Apply missing bite gloss

on:
  push:
    branches:
      - chatgpt/ngsl-gloss-refresh
    paths:
      - tmp/apply_missing_bite_gloss.py
      - .github/workflows/apply-missing-bite-gloss.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ngsl-gloss-refresh
      - run: python3 tmp/apply_missing_bite_gloss.py
      - run: |
          git add data/chunks/027.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: fix NGSL bite Japanese gloss"
          git push
