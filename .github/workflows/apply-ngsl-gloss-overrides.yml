name: Apply NGSL gloss refresh

on:
  push:
    branches:
      - chatgpt/ngsl-gloss-refresh
    paths:
      - tmp/ngsl_japanese_overrides_2026-09-12.csv
      - tmp/apply_ngsl_gloss_overrides.py
      - .github/workflows/apply-ngsl-gloss-overrides.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ngsl-gloss-refresh
      - name: Apply reviewed Japanese overrides
        run: python3 tmp/apply_ngsl_gloss_overrides.py
      - name: Commit changed chunks
        run: |
          git add data/chunks/*.csv
          if git diff --cached --quiet; then
            echo "No chunk changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh NGSL Japanese glosses"
          git push
